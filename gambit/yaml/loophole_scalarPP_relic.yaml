        - [3.68201e-05, 0.123482, 4.53681e-10, -1.17366e-11, 5.70796e-07, -1.42609e-05]   # Oh2 = 0.1200
        - [2.27128e-05, 0.00245645, 2.1929e-12, 0.00471498, -6.23287e-09, -3.4366e-11]   # Oh2 = 0.1200
        - [0.0177437, 1.34257, 2.09603e-06, -3.13593e-08, 4.16593e-11, -0.0111505]   # Oh2 = 0.1200
