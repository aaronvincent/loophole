Logger:
  redirection:
    [Default] : "default.log"
    [Scanner] : "Scanner.log"


KeyValues:
  # (3) INTERACTION output tag (sync with func_name):
  default_output_path: "runs/heavyScalarSP_relic"
  print_timing_data: true
  rng:
    generator: ranlux48
    seed: -1
  likelihood:
    model_invalid_for_lnlike_below: -1.0e5
    print_invalid_points: false
