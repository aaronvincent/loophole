        - [1.14996e-05, 2.16257, 8.21044e-06, -0.00116501, -2.35723e-05, 4.83783e-08]   # Oh2 = 0.1200
        - [0.00396944, 2.20617, 6.14847e-05, -9.36402e-06, 4.46904e-10, 0.000201416]   # Oh2 = 0.1200
