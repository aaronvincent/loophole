        - [0.000426291, 1.81716, 1.40074e-05, 0.330211, 4.79982e-07, -8.00992e-08]   # Oh2 = 0.1200
        - [0.0017347, 8.81403, 0.00499909, 0.333333, 0.333333, 0.333333]   # Oh2 = 0.1199
        - [0.0497642, 0.09401, 9.70332e-11, 1.36157e-06, 0.122107, -9.77875e-10]   # Oh2 = 0.1200
