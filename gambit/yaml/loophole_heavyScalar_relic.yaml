        - [0.000426291, 1.81716, 0.000120294, 0.330211, 4.79982e-07, -8.00992e-08]   # Oh2 = 0.1200
        - [0.0935675, 0.000451011, 1.87237e-07, 0.333333, 0.333333, 0.333333]   # Oh2 = 0.1200
        - [3.01834e-06, 2.34705e-06, 5.38884e-07, 0.333333, 0.333333, 0.333333]   # Oh2 = 0.1200
