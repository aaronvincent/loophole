# ----------------------------------------------------------------------------
# GAMBIT-light relic-only scan of Loophole: heavyScalar.
#
# Scanned axes: mx, mphi, gx, gu, gd, gs (6D).  The quark couplings g = [gu, gd,
# gs] are independent signed-log axes (ScannerBit double_log_flat_join: log on
# both sides of zero, flat across a small zero-gap).  The likelihood is the relic
# abundance only (Delta-Neff sigmas = 0); every other constraint is applied
# afterwards by analysis/postprocess.py.
#
# Before running, build the user library and export the worker settings
# (paths relative to the repository root; see README.md):
#   gambit/build.sh
#   export LOOP_JULIA_BIN=julia
#   export LOOP_JULIA_PROJECT=$PWD/julia/Loophole
#   export LOOP_WORKER_JL=$PWD/gambit/worker/worker.jl
#   export LOOP_JULIA_SYSIMAGE=$PWD/gambit/loopabundance_sys.so   # optional
# and set `user_lib` below to the absolute path of gambit/cpp/loop_loglike.so.
#
# To scan another interaction, edit func_name, output_file and
# default_output_path together, and re-derive `initial_guesses` (the Oh2 = 0.12
# ridge moves per interaction).
# ----------------------------------------------------------------------------

UserModel:

  # GAMBIT-light requires the entry keys to be p0/p1/...; the human-readable
  # parameter name lives in `name:` (this is what is passed to the user lib).

  # --- scanned parameters (log-flat priors over the sub-GeV range) ---
  p1:
    name: mx
    prior_type: log
    range: [1.0e-6, 1.0]        # DM mass [GeV]
  p2:
    name: mphi
    prior_type: log
    range: [1.0e-9, 10.0]       # mediator mass [GeV]
  p3:
    name: gx
    prior_type: log
    range: [1.0e-13, 1.0]       # dark coupling

  # --- quark couplings g = [gu, gd, gs], scanned independently (signed log) ---
  # double_log_flat_join: log branches on each side of zero joined by a flat bridge
  # across [-1e-11, 1e-11].  Reaches |g| ~ 1e-11 with uniform per-decade
  # resolution (needed for the weak-coupling axial regime) while keeping sign.
  # ranges = [lower, flat_start, flat_end, upper].
  p4: {name: gu, prior_type: double_log_flat_join, ranges: [-1.0, -1.0e-11, 1.0e-11, 1.0]}
  p5: {name: gd, prior_type: double_log_flat_join, ranges: [-1.0, -1.0e-11, 1.0e-11, 1.0]}
  p6: {name: gs, prior_type: double_log_flat_join, ranges: [-1.0, -1.0e-11, 1.0e-11, 1.0]}

  # --- tunables (read by the user lib via fixed_value; defaults shown) ---
  p7:  {name: T_RH,          fixed_value: 0.01}   # reheat temperature [GeV]
  p8:  {name: s_mix,         fixed_value: 0.3}    # axial small-mixing threshold
  p9:  {name: relic_mode,    fixed_value: 0}      # 0 Gaussian (chi=all DM), 1 upper-limit
  p10: {name: relic_mu,      fixed_value: 0.12}   # Planck Omega h^2
  p11: {name: relic_sigma,   fixed_value: 0.012}  # relic sigma (incl. theory error)
  # Delta-Neff: two-sided Gaussian on the measured value at each epoch.
  # BBN -0.14 +/- 0.21 (arXiv:2401.15054); CMB -0.054 +/- 0.17
  # (Planck N_eff = 2.99 +/- 0.17 vs SM 3.044).  Two-sided is required: the
  # model's CMB Delta Neff is signed and can go negative (photon heating).
  p12: {name: neff_bbn_mode,  fixed_value: 0}      # 0 two-sided Gaussian / 1 cap
  p13: {name: neff_bbn_mu,    fixed_value: -0.14}  # BBN measured Delta Neff
  p14: {name: neff_bbn_sigma, fixed_value: 0.0}    # DISABLED (relic-only scan; Delta-Neff off)
  p15: {name: neff_cmb_mode,  fixed_value: 0}      # 0 two-sided Gaussian / 1 cap
  p16: {name: neff_cmb_mu,    fixed_value: -0.054}  # CMB measured Delta Neff
  p17: {name: neff_cmb_sigma, fixed_value: 0.0}    # DISABLED (relic-only scan; Delta-Neff off)


UserLogLikes:

  loophole:
    lang: cpp
    # EDIT to the absolute path of the built library:
    user_lib: /ABS/PATH/TO/loophole/gambit/cpp/loop_loglike.so
    # (1) INTERACTION -- pick here: loop_heavyScalar / loop_heavyScalarPS / ... /
    # loop_axialVector (one registered function per model).
    func_name: loop_heavyScalar
    output:
      - Oh2
      - dNeff_bbn
      - dNeff_cmb
      - sigma_chiN
      - eft_valid
      - sin_mix
      - gx_ceiling
      - solver

Printer:
  # NB: keep output_file / default_output_path in sync with func_name (see the
  # header).  6 scanned params here (mx, mphi, gx,
  # gu, gd, gs) => "heavyScalar_relic".
  printer: hdf5
  options:
    # (2) INTERACTION output tag:
    output_file: "heavyScalar_relic.hdf5"
    group: "/data"
    delete_file_on_restart: true
    # Points buffered per rank before the shared output file is opened,
    # written and closed again.  The default (1000) means ~one open/close
    # per rank every few seconds; at 50 ranks that hammers the cluster FS
    # hard enough for an H5Fopen to fail transiently and kill the job.
    buffer_length: 20000


  # printer: ascii        # human-readable .dat (swap in for quick inspection)
  # options:
  #   output_file: "heavyScalar_relic.dat"
  #   buffer_length: 10
  #   delete_file_on_restart: true


Scanner:
  use_scanner: diver

  scanners:

    # Quick smoke-test sampler.
    random:
      plugin: random
      point_number: 20

    # Differential-evolution optimiser for real runs.  6 parameters are scanned
    # here (mx, mphi, gx, gu, gd, gs), and the likelihood is rugged/multimodal --
    # Breit-Wigner resonance ridges, the FIMP/WIMP crossing, the EFT-validity
    # cliffs, plus the now-open coupling directions -- so keep the population
    # generous and let jDE self-adapt the mutation/crossover rates.
    diver:
      plugin: diver
      NP: 3500                  # population per generation (6D; ~150x ndim -> 900 min,
                               #   kept higher for the extra coupling directions)
      convthresh: 1.0e-3       # smoothed fractional improvement to call convergence
      convsteps: 10            # generations smoothed over for the convergence test
      maxgen: 5000             # hard cap on generations per civilisation
      maxciv: 1                # single civilisation (no restart-from-scratch loop)
      jDE: true                # self-adaptive rand/1/bin (Brest et al. 2006) — set
                               #   F, Cr automatically; preferred over hand-tuning
      lambdajDE: false         # rand-to-best/1/bin self-adaptation (off; jDE only)
      Cr: 0.9                  # crossover rate (ignored when jDE=true, kept as seed)
      lambda: 0.0              # best/rand mixing (0 = pure rand/1; ignored by jDE)
      current: false           # mutate around rand vector, not the current one
      expon: false             # binomial (not exponential) crossover
      bndry: 3                 # boundary handling: 3 = reflect back into the box
      removeDuplicates: true   # drop duplicate vectors within a generation
      init_population_strategy: 2   # n-shot init, error out if no valid seed found
      max_initialisation_attempts: 10000  # tries per initial slot to land a valid
                               #   point (the EFT cuts reject a lot of the box)
      savecount: 1             # checkpoint every generation (cheap resume)
      full_native_output: true # also write Diver's native .raw sample file
      verbosity: 1             # 0=errors 1=basic 2=civ-level 3+=population
      seed: -1                 # <=0 => seed from system clock

      # Seed the initial population with known-good points (relic Omega h^2 ~ 0.12
      # for loop_heavyScalar).  All six scanned params are listed; the couplings
      # are seeded at the symmetric g=[1/3,1/3,1/3] point so the verified ridge is
      # represented from generation 0.  Re-derive if you change func_name or the
      # mass ranges (each interaction's relic ridge sits elsewhere).
      # Seeds generated (2026-10-20) by direct relic solves, NOT harvested
      # from a prior scan: on the FIMP branch Oh2 ∝ gx^2, so one evaluation per
      # (mx, mphi, g) fixes the gx that lands on 0.12.  Drawn from this scan's own
      # priors, then each seed re-evaluated from scratch (no rescaling) and kept
      # only if finite, EFT-valid and within 1e-3 of target -- so the Oh2 comments
      # are measured.  Regenerate after any physics change; do NOT reuse seeds
      # harvested from a run that predates it (find_seeds.py reads the STORED
      # output::Oh2 column, which a physics change silently invalidates).
      initial_guesses:
        parameters: [UserModel::p1, UserModel::p2, UserModel::p3, UserModel::p4, UserModel::p5, UserModel::p6]   # mx,mphi,gx,gu,gd,gs
